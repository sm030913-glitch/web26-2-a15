<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>

    <h2>4선택가능한 입력 양식</h2>
    <select>
        <option>김밥</option>
        <option>떡볶이</option>
        <option>순대</option>
        <option>어묵</option>
    </select>

    <h2>5여러 과목 선택하기</h2>
    <select multiple="multiple">
        <option>김밥</option>
        <option>떡볶이</option>
        <option>순대</option>
        <option>어묵</option>
    </select>

    <h2>선택 옵션 묶기</h2>
    <!--optgroup태그를 이용해 선택 옵션을 그룹으로 묶음-->
    <select>
        <optgroup label="html5">
            <option>multimedia tag</option>
            <option>connectivity</option>
            <option>device access</option>     
        </optgroup>
        <optgroup label="css3">
            <option>animation</option>
            <option>30 transform</option>
        </optgroup>
        
    </select>
</body>
</html>
